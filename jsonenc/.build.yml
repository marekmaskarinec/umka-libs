image: debian/bullseye
packages:
- python3
- python3-pip
sources:
- https://git.sr.ht/~mrms/jsonencum
- https://git.sr.ht/~mrms/pak
environment:
  project: jsonenc
secrets:
- 7f47af0c-9fd1-4363-bac6-52b04721d2f9
shell: false
tasks:
- setup: |
    cd pak
    python3 -m pip install -r requirements.txt
    ./setup.py install --user
- build: |
    cd jsonencum
    python3 -m pak update
    python3 -m pak build
- deploy: |
    cd jsonencum
    set +x
    python3 -m pak upload -t `cat ../.secret` pak.tar
    python3 -m pak upload -t `cat ../.secret` pak.json
    set -x
