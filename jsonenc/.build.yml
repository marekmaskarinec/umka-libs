image: debian/bullseye
packages:
- python3
- python3-pip
sources:
- https://git.sr.ht/~mrms/jsonencum
- https://git.sr.ht/~mrms/pak
environment:
  project: jsonenc
secrets:
- f101f3df-10a6-48b6-8f7d-65e4dd2223a8
shell: false
tasks:
- setup: |
    cd pak
    python3 -m pip install -r requirements.txt
    ./setup.py install --user
- build: |
    cd jsonencum
    python3 -m pak update
    python3 -m pak build
- deploy: |
    cd jsonencum
    set +x
    python3 -m pak upload -t `cat ../.secret` pak.tar
    python3 -m pak upload -t `cat ../.secret` pak.json
    set -x
