image: debian/bullseye
packages:
- curl
- libcurl4-openssl-dev
- mingw-w64
- unzip
sources:
- https://git.sr.ht/~mrms/httpum
environment:
  project: http
secrets:
- 591523b2-7d79-4732-961b-46f4a8658d6b
shell: false
tasks:
- setup: |
    curl https://pak.tophat2d.dev/static/pak_portable.zip -O
    unzip pak_portable.zip
- build: |
    cd httpum
    ../pak_portable/pak update
    ../pak_portable/pak build
- deploy: |
    cd httpum
    set +x
    ../pak_portable/pak upload -t `cat ../.secret` pak.tar
    ../pak_portable/pak upload -t `cat ../.secret` pak.json
    set -x

