image: debian/bullseye
packages:
  - python3
  - python3-pip
  - mingw-w64
sources:
  - https://git.sr.ht/~mrms/httpum
  - https://git.sr.ht/~mrms/pak#ae91385ac529031a1340e443ca9014d9de08cebd
environment:
  project: http
secrets:
  - 591523b2-7d79-4732-961b-46f4a8658d6b
shell: false
tasks:
  - setup: |
      cd pak
      python3 -m pip install -r requirements.txt
      ./setup.py install --user
  - build: |
      cd httpum
      python3 -m pak update
      python3 -m pak build
  - deploy: |
      cd httpum
      set +x
      python3 -m pak upload -t `cat ../.secret` pak.tar
      python3 -m pak upload -t `cat ../.secret` pak.json
      set -x
