image: debian/bullseye
packages:
- python3
- python3-pip
sources:
- https://git.sr.ht/~mrms/filepathum
- https://git.sr.ht/~mrms/pak
environment:
  project: filepath
secrets:
- 8bafe431-75a5-43a8-a2d5-8a2ce760d1cb
shell: false
tasks:
- setup: |
    cd pak
    python3 -m pip install -r requirements.txt
    ./setup.py install --user
- build: |
    cd filepathum
    python3 -m pak update
    python3 -m pak build
- deploy: |
    cd filepathum
    set +x
    python3 -m pak upload -t `cat ../.secret` pak.tar
    python3 -m pak upload -t `cat ../.secret` pak.json
    set -x
