image: debian/bullseye
packages:
- curl
- mingw-w64
- unzip
secrets:
- 7f91a5cb-3777-4949-a6b8-4f8f3e924797
sources:
- https://git.sr.ht/~mrms/osum
environment:
    NAME: osum
tasks:
- setup: |
    curl https://mrms.cz/dl/umbox/umbox_portable_v12.zip -o umbox_portable.zip
    unzip umbox_portable.zip
- build: |
    cd $NAME
    ../umbox_portable/umbox update
    ../umbox_portable/umbox build
- deploy: |
    cd $NAME
    set +x
    ../umbox_portable/umbox upload `cat ../.secret` box.tar
    set -x
