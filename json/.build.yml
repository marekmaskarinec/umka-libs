image: debian/bullseye
packages:
- curl
- mingw-w64
- unzip
secrets:
- 8e8fa4e3-0545-49c3-87b7-751b60055a3f
sources:
- https://git.sr.ht/~mrms/jsonum
environment:
    NAME: jsonum
tasks:
- setup: |
    curl https://mrms.cz/dl/umbox/umbox_portable.zip -O
    unzip umbox_portable.zip
- build: |
    cd $NAME
    ../umbox_portable/umbox update
    ../umbox_portable/umbox build
- deploy: |
    cd $NAME
    set +x
    ../umbox_portable/umbox upload `cat ../.secret` box.tar
    ../umbox_portable/umbox upload `cat ../.secret` box.json
    set -x
