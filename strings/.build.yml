image: debian/bullseye
packages:
- python3
- python3-pip
sources:
- https://git.sr.ht/~mrms/stringsum
- https://git.sr.ht/~mrms/pak
environment:
  project: strings
secrets:
- 1489eefb-014f-4007-b40e-4651f2f9a8c0
shell: false
tasks:
- setup: |
    cd pak
    python3 -m pip install -r requirements.txt
    ./setup.py install --user
- build: |
    cd stringsum
    python3 -m pak update
    python3 -m pak build
- deploy: |
    cd stringsum
    set +x
    python3 -m pak upload -t `cat ../.secret` pak.tar
    python3 -m pak upload -t `cat ../.secret` pak.json
    set -x
