image: debian/bullseye
packages:
- curl
- mingw-w64
- unzip
secrets:
- d4867610-238d-4996-9810-b162f92b5ac9
sources:
- https://git.sr.ht/~mrms/logsum
environment:
    NAME: logsum
tasks:
- setup: |
    curl https://mrms.cz/dl/up/umbox_portable.zip -O
    unzip umbox_portable.zip
- build: |
    cd $NAME
    ../umbox_portable/umbox update
    ../umbox_portable/umbox build
- deploy: |
    cd $NAME
    set +x
    ../umbox_portable/umbox upload `cat ../.secret` box.tar
    set -x
