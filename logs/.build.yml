image: debian/bullseye
packages:
- python3
- python3-pip
sources:
- https://git.sr.ht/~mrms/logsum
- https://git.sr.ht/~mrms/pak
environment:
  project: logs
secrets:
- 4e255e0f-48f4-43c0-b683-3d4c54aff06e
shell: false
tasks:
- setup: |
    cd pak
    python3 -m pip install -r requirements.txt
    ./setup.py install --user
- build: |
    cd logsum
    python3 -m pak update
    python3 -m pak build
- deploy: |
    cd logsum
    set +x
    python3 -m pak upload -t `cat ../.secret` pak.tar
    python3 -m pak upload -t `cat ../.secret` pak.json
    set -x
